[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Maze generator and solver"
readme = "README.md"
authors = [
    {name = "naalorsan", email = "amal.orsan@learner.42.tech"},
    {name = "leobeida", email = "leen.obeidat@learner.42.tech"}
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

requires-python = ">=3.10"

[tool.setuptools]
packages = ["mazegen"]
